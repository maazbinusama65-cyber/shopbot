name: regression
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pyyaml -r backend/requirements-dev.txt
      - name: Test sessions are valid
        run: |
          for f in contrib/*.jsonl; do
            python -m harness.validate_sessions "$f" --contrib
          done
      - name: Backend unit tests
        run: cd backend && python -m pytest -q
