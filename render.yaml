# Render blueprint: New + > Blueprint > pick this repo. Secrets (sync: false) are entered in the Render dashboard.
services:
  - type: web
    name: shopbot-agent
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
