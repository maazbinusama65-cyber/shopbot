<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller dashboard — Loom &amp; Leaf</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/">Loom <i>&amp;</i> Leaf <small style="font:400 .8rem var(--sans);color:var(--ink-2)">seller dashboard</small></a>
    <nav><a href="/" class="keep">Storefront</a><a href="#" id="logout">Log out</a></nav></header>

  <form class="login" id="login" hidden>
    <h2 class="sec">Seller login</h2>
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Enter</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <main id="app" hidden>
    <div class="admin-bar" role="tablist" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
